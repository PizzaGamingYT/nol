<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nol'sGames</title>
    <link rel="icon" href="https://cdn.jsdelivr.net/gh/PizzaGamingYT/nol/favicon.ico?v=2">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@100..900&family=Shrikhand&display=swap" rel="stylesheet">
    <meta property="og:title" content="Nol'sGames">
    <meta property="og:description" content="Play 1900+ browser games!">
    <meta property="og:url" content="https://nolsgames.xyz">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://nolsgames.xyz/favicon.ico?v=2">
    <meta name="description" content="Play over 1900 browser games on Nol'sGames! Updated regularly with more fun games and extra functionality!">
    <meta name="keywords" content="games, browser games, html5 games, nolsgames, nols games, online games">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://nolsgames.xyz">
    <style>
      body {
        margin: 0;
        font-family: "Commissioner", sans-serif;
        background: #111;
        color: #fff;
        overflow: hidden;
      }

      #ticker {
        position: fixed;
        top: 56px;
        left: 0;
        width: 100%;
        height: 28px;
        background: #ff4d00;
        overflow: hidden;
        z-index: 9999;
        display: flex;
        align-items: center;
      }

      #tickerText {
        position: absolute;
        white-space: nowrap;
        font-family: "Shrikhand";
        will-change: transform;
        -webkit-text-stroke: 7.5px black;
        paint-order: stroke fill;
      }

      .ngToggleWrap {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: fit-content;
        min-width: 260px;
        background: #222222;
        color: #fff;
        border: 2px solid #ff4d00;
        border-radius: 12px;
        padding: 12px;
        font-family: "Commissioner", sans-serif;
        box-sizing: border-box;
        cursor: pointer;
      }

      .ngToggleWrap:hover {
        background: #ff4d00;
      }

      .ngSwitch {
        position: relative;
        width: 42px;
        height: 22px;
        margin-left: 12px;
        flex-shrink: 0;
      }

      .ngSwitch input {
        opacity: 0;
        width: 0;
        height: 0;
      }

      .ngSlider {
        position: absolute;
        inset: 0;
        background: #111;
        border: 2px solid #fff;
        border-radius: 999px;
        transition: .2s;
      }

      .ngSlider:before {
        content: "";
        position: absolute;
        width: 14px;
        height: 14px;
        left: 2px;
        top: 2px;
        background: #FFF;
        border-radius: 50%;
        transition: .2s;
      }

      .ngSwitch input:checked+.ngSlider {
        background: #FF4D00;
      }

      .ngSwitch input:checked+.ngSlider:before {
        transform: translateX(18px);
        background: #FFF;
      }

      .section {
        scroll-margin-top: 70px;
      }

      #topbar {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        background: #ff4d00;
        padding: 10px;
        display: flex;
        align-items: center;
        gap: 10px;
        z-index: 9998;
      }

      #logo {
        height: 36px;
      }

      .tab {
        background: #ff4d00;
        border: 0;
        color: #fff;
        padding: 10px 16px;
        border-radius: 16px;
        cursor: pointer;
        font-family: "Shrikhand";
        -webkit-text-stroke: 7.5px black;
        paint-order: stroke fill;
      }

      .tab:hover {
        background: #222;
      }

      #sidebar {
        display: none;
        position: fixed;
        top: 84px;
        left: 0;
        width: 60px;
        height: calc(100% - 84px);
        overflow: auto;
        background: #111;
        z-index: 5;
        transition: top .2s ease, height .2s ease;
      }

      body.ticker-hidden #sidebar {
        top: 60px;
        height: calc(100% - 60px);
      }

      #main {
        margin-left: 0;
        margin-top: 84px;
        height: calc(100vh - 84px);
        overflow: auto;
        padding: 0 10px;
        box-sizing: border-box;
      }

      body.ticker-hidden #main {
        margin-top: 56px;
        height: calc(100vh - 56px);
      }

      .withSidebar #sidebar {
        display: block;
      }

      .withSidebar #main {
        margin-left: 70px;
      }

      #searchWrap {
        position: sticky;
        top: 0;
        z-index: 1000;
        padding: 10px 0;
        background: #111;
      }

      #search {
        width: 100%;
        box-sizing: border-box;
        padding: 14px;
        border-radius: 14px;
        border: 2px solid #222;
        background: #222;
        color: #fff;
        font-family: "Shrikhand";
      }

      #search:focus {
        outline: none;
        border-color: #ff4d00;
      }

      .sidebar-btn {
        display: block;
        width: 100%;
        padding: 8px;
        background: #222;
        color: #fff;
        border: none;
        font-family: "Shrikhand";
      }

      .sidebar-btn:hover {
        background: #ff4d00;
      }

      .section {
        margin-bottom: 20px;
      }

      .section h2 {
        margin: 10px 0;
      }

      .game-btn {
        width: 100%;
        max-width: 100%;
        box-sizing: border-box;
        padding: 14px;
        margin: 6px 0;
        background: #222;
        color: #fff;
        border: 2px solid #222;
        border-radius: 14px;
        cursor: pointer;
        display: flex;
        justify-content: space-between;
        align-items: center;
        transition: background-color .25s ease,
          border-color .25s ease,
          color .25s ease,
          transform .15s ease;
      }

      .game-btn:hover {
        background: #ff4d00;
      }

      .rainbow-game {
        border-color: transparent;
        background:
          linear-gradient(#222, #222) padding-box,
          linear-gradient(90deg,
            red, orange, yellow, lime, cyan, blue, violet) border-box;
        transition: .25s;
      }

      .rainbow-game:hover {
        background:
          linear-gradient(90deg,
            red, orange, yellow, lime, cyan, blue, violet) padding-box,
          linear-gradient(90deg,
            red, orange, yellow, lime, cyan, blue, violet) border-box;
        color: white;
        transition: .25s;
      }

      .rainbow-game:hover .star.off::after {
        color: white;
      }

      .rainbow-game:hover .star.on::after {
        color: gold;
      }

      .rainbow-game.fav {
        border-color: transparent;
        background:
          linear-gradient(#222, #222) padding-box,
          linear-gradient(90deg,
            red, orange, yellow, lime, cyan, blue, violet) border-box;
        transition: .25s;
      }

      .rainbow-game.fav:hover {
        background:
          linear-gradient(90deg,
            red, orange, yellow, lime, cyan, blue, violet) padding-box,
          linear-gradient(90deg,
            red, orange, yellow, lime, cyan, blue, violet) border-box;
        color: white;
        transition: .25s;
      }

      .game-btn.fav:not(.rainbow-game) {
        border-color: #FF4D00;
      }

      .star {
        cursor: pointer;
        position: relative;
      }

      .star.off::after {
        content: "★";
        color: #888;
      }

      .star.on::after {
        content: "★";
        color: gold;
      }

      .danger {
        background: red;
        color: #fff;
        border: none;
        padding: 12px;
        border-radius: 12px;
        cursor: pointer;
      }

      .standard {
        background: #222222;
        color: #fff;
        border: 2px solid #ff4d00;
        padding: 12px;
        border-radius: 12px;
        cursor: pointer;
      }

      .standard:hover {
        background: #ff4d00;
      }

      #tocModal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #000d;
        display: none;
        z-index: 10000;
      }

      .modal {
        background: #111;
        margin: 5% auto;
        padding: 20px;
        width: 60%;
        max-height: 80%;
        overflow: auto;
        border-radius: 16px;
      }

      .modal button {
        background: #ff4d00;
        border: none;
        padding: 10px 20px;
        border-radius: 20px;
        margin: 10px;
        cursor: pointer;
      }

      #presetModal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #000b;
        display: none;
        z-index: 11000;
      }

      .presetBox {
        background: #111;
        margin: 5% auto;
        padding: 20px;
        width: 400px;
        border-radius: 16px;
      }

      .presetBox input {
        width: 100%;
        margin: 6px 0;
        padding: 10px;
        border-radius: 10px;
        border: 2px solid #222;
        background: #222;
        color: #fff;
      }

      .presetBox input {
        box-sizing: border-box;
      }

      .presetBox button {
        background: #ff4d00;
        border: none;
        padding: 10px 20px;
        border-radius: 20px;
        margin: 10px;
        cursor: pointer;
      }

      .presetBox label {
        background: #ff4d00;
        border: none;
        padding: 10px 20px;
        border-radius: 20px;
        margin: 10px;
        cursor: pointer;
        color: black;
      }

      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }

      ::-webkit-scrollbar-track {
        background: #111;
        border-radius: 10px;
      }

      ::-webkit-scrollbar-thumb {
        background: linear-gradient(180deg, #ff4d00, #ff8a00);
        border-radius: 10px;
        border: 2px solid #111;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: linear-gradient(180deg, #ff8a00, #ff4d00);
      }

      ::-webkit-scrollbar-corner {
        background: #111;
      }

      * {
        scrollbar-width: thin;
        scrollbar-color: #ff4d00 #111;
      }

      .download-page {
        display: flex;
        justify-content: center;
        padding: 40px 20px;
      }

      .download-card {
        max-width: 600px;
        width: 100%;
        text-align: center;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 20px;
        padding: 25px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, .25);
        border: 1px solid rgba(255, 255, 255, .1);
      }

      .download-logo {
        width: 575px;
        height: auto;
        object-fit: contain;
        margin-bottom: 15px;
      }

      .download-card h2 {
        font-size: 32px;
        margin-bottom: 10px;
      }

      .download-card p {
        opacity: .85;
        font-size: 17px;
      }

      .download-info {
        margin: 25px 0;
        display: grid;
        gap: 12px;
      }

      .download-info div {
        background: rgba(255, 255, 255, .06);
        padding: 15px;
        border-radius: 12px;
      }

      .download-info strong {
        display: block;
        color: #ff4d00;
        font-size: 18px;
      }

      .download-info span {
        opacity: .8;
      }

      .download-button {
        width: 100%;
        padding: 16px;
        margin: 10px 0;
        border-radius: 12px;
        border: none;
        background: #ff4d00;
        color: white;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        transition: .2s;
      }

      .download-button:hover {
        transform: translateY(-2px);
        filter: brightness(1.1);
      }

      .toc-link {
        color: #ff4d00;
        cursor: pointer;
        text-decoration: none;
        font-weight: bold;
        transition: .2s;
      }

      .toc-link:hover {
        text-decoration: underline;
      }

      #adminLoginModal {
        position: fixed;
        inset: 0;
        background: #000b;
        display: none;
        z-index: 12000;
        align-items: center;
        justify-content: center;
      }

      .adminLoginBox {
        width: 400px;
        max-width: calc(100% - 40px);
        box-sizing: border-box;
        background: #111;
        border: 2px solid #ff4d00;
        border-radius: 16px;
        padding: 25px;
        box-shadow: 0 15px 50px #000;
      }

      .adminLoginBox h2 {
        margin-top: 0;
        margin-bottom: 20px;
      }

      .adminLoginBox input {
        width: 100%;
        box-sizing: border-box;
        padding: 14px;
        margin-bottom: 10px;
        background: #222;
        color: #fff;
        border: 2px solid #222;
        border-radius: 12px;
        font-family: "Commissioner", sans-serif;
      }

      .adminLoginBox input:focus {
        outline: none;
        border-color: #ff4d00;
      }

      .adminLoginBox button {
        background: #ff4d00;
        color: #fff;
        border: none;
        border-radius: 12px;
        padding: 12px 20px;
        margin: 5px;
        cursor: pointer;
        font-family: "Commissioner", sans-serif;
        font-weight: bold;
      }

      .adminLoginBox button:hover {
        filter: brightness(1.1);
      }

      .adminLoginBox .adminCancel {
        background: #222;
      }

      #adminLoginStatus {
        min-height: 20px;
        margin-bottom: 10px;
        color: #fff;
      }

      #noticeContainer {
        position: fixed;
        top: 95px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 20000;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        pointer-events: none;
      }

      .ngNotice {
        width: 360px;
        max-width: calc(100vw - 30px);
        box-sizing: border-box;
        background: #222;
        color: #fff;
        border: 2px solid;
        border-radius: 14px;
        padding: 13px 35px 17px 16px;
        font-family: "Commissioner", sans-serif;
        font-weight: 600;
        position: relative;
        overflow: hidden;
        box-shadow: 0 10px 30px #0008;
        animation: ngNoticeIn .35s ease forwards;
        pointer-events: auto;
      }

      .ngNotice.success {
        border-color: #22c55e;
      }

      .ngNotice.warning {
        border-color: #ff8a00;
      }

      .ngNotice.alert {
        border-color: #ff3333;
      }

      .ngNoticeContent {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .ngNoticeIcon {
        font-size: 18px;
        flex-shrink: 0;
      }

      .ngNotice.success .ngNoticeIcon {
        color: #22c55e;
      }

      .ngNotice.warning .ngNoticeIcon {
        color: #ff8a00;
      }

      .ngNotice.alert .ngNoticeIcon {
        color: #ff3333;
      }

      .ngNoticeBar {
        position: absolute;
        bottom: 0;
        left: 0;
        height: 4px;
        width: 100%;
        transform-origin: left;
        animation: ngNoticeDecay 3s linear forwards;
      }

      .ngNotice.success .ngNoticeBar {
        background: #22c55e;
      }

      .ngNotice.warning .ngNoticeBar {
        background: #ff8a00;
      }

      .ngNotice.alert .ngNoticeBar {
        background: #ff3333;
      }

      .ngNotice.closing {
        animation: ngNoticeOut .35s ease forwards;
      }

      @keyframes ngNoticeIn {
        from {
          transform: translateY(-40px);
          opacity: 0;
        }

        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      @keyframes ngNoticeOut {
        from {
          transform: translateY(0);
          opacity: 1;
        }

        to {
          transform: translateY(-50px);
          opacity: 0;
        }
      }

      @keyframes ngNoticeDecay {
        from {
          transform: scaleX(1);
        }

        to {
          transform: scaleX(0);
        }
      }

      .ngConfirm {
        width: 360px;
        max-width: calc(100vw - 30px);
        box-sizing: border-box;
        background: #222;
        color: #fff;
        border: 2px solid #ff4d00;
        border-radius: 14px;
        padding: 16px;
        font-family: "Commissioner", sans-serif;
        box-shadow: 0 10px 30px #0008;
        pointer-events: auto;
        animation: ngNoticeIn .35s ease forwards;
      }

      .ngConfirmTitle {
        font-size: 17px;
        font-weight: 700;
        margin-bottom: 14px;
      }

      .ngConfirmButtons {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }

      .ngConfirm button {
        border: none;
        border-radius: 10px;
        padding: 9px 16px;
        cursor: pointer;
        font-family: "Commissioner", sans-serif;
        font-weight: 700;
      }

      .ngConfirmYes {
        background: #ff4d00;
        color: #fff;
      }

      .ngConfirmNo {
        background: #333;
        color: #fff;
      }

      .ngConfirm button:hover {
        filter: brightness(1.15);
      }

      .ngNoticeClose {
        position: absolute;
        top: 5px;
        right: 7px;
        background: none;
        border: none;
        color: #888;
        font-size: 20px;
        line-height: 1;
        padding: 2px 5px;
        cursor: pointer;
        font-family: Arial, sans-serif;
      }

      .ngNoticeClose:hover {
        color: #fff;
      }

      #adminIndicator {
        display: none;
        position: absolute;
        right: 50px;
        top: 50%;
        transform: translateY(-50%);
        color: #fff;
        font-family: "Commissioner", sans-serif;
        font-weight: 700;
        -webkit-text-stroke: 7.5px black;
        paint-order: stroke fill;
      }

      .no-transition+.ngSlider {
        transition: none !important;
      }

      .no-transition+.ngSlider::before {
        transition: none !important;
      }

      .password-wrap {
        position: relative;
        width: 100%;
        margin-bottom: 10px;
      }

      .password-wrap input {
        width: 100%;
        padding-right: 75px;
        margin-bottom: 0;
      }

      #showPasswordBtn {
        position: absolute;
        right: 6px;
        top: 50%;
        transform: translateY(-50%);
        background: transparent;
        color: #aaa;
        border: none;
        padding: 6px 8px;
        margin: 0;
        cursor: pointer;
        font-family: "Commissioner", sans-serif;
        font-weight: 600;
      }

      #showPasswordBtn:hover {
        color: #fff;
        filter: none;
      }

      .searchBox {
        position: relative;
        width: 100%;
      }

      #search {
        padding-right: 45px;
      }

      #clearSearch {
        position: absolute;
        right: 8px;
        top: 50%;
        transform: translateY(-50%);
        width: 32px;
        height: 32px;
        border: none;
        border-radius: 50%;
        background: #333;
        color: #fff;
        font-size: 22px;
        line-height: 1;
        cursor: pointer;
        display: none;
      }

      #clearSearch:hover {
        background: #ff4d00;
      }

      .noResults {
        text-align: center;
        padding: 50px 20px;
        color: #888;
      }

      .noResults h2 {
        color: #fff;
      }

      #loadingScreen {
        position: fixed;
        inset: 0;
        z-index: 50000;
        background: #111;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }

      #loadingScreen img {
        width: min(400px, 70vw);
        height: auto;
        margin-bottom: 20px;
      }

      #loadingScreen h1 {
        margin: 0;
        font-family: "Shrikhand", sans-serif;
      }

      #loadingScreen p {
        color: #aaa;
      }

      #loadingScreen.hidden {
        opacity: 0;
        pointer-events: none;
        transition: opacity .3s ease;
      }

      .settings-page {
        max-width: 800px;
        margin: 0 auto;
        padding: 20px;
      }

      .settings-page>h2 {
        font-size: 32px;
        margin-bottom: 25px;
      }

      .settings-section {
        background: #1a1a1a;
        border: 2px solid #222;
        border-radius: 16px;
        padding: 20px;
        margin-bottom: 20px;
      }

      .settings-section h3 {
        margin-top: 0;
        margin-bottom: 15px;
        color: #ff4d00;
      }

      .settings-section .standard,
      .settings-section .danger {
        margin: 5px;
      }

      .settings-section .ngToggleWrap {
        margin: 10px 5px;
      }
    </style>
  </head>
  <body>
    <div id="loadingScreen">
      <img src="https://cdn.jsdelivr.net/gh/PizzaGamingYT/nol/logo.png" alt="Nol'sGames">
      <h1>Loading Nol'sGames...</h1>
      <p>Loading game library...</p>
    </div>
    <div id="noticeContainer"></div>
    <div id="topbar">
      <img id="logo" src="https://cdn.jsdelivr.net/gh/PizzaGamingYT/nol/logo.png">
      <button class="tab" onclick="showTab('games')">Games</button>
      <button class="tab" onclick="window.open('https://docs.google.com/document/d/1BaIyWZoUosVcc7D3rwwEsx7-fWeDGgD4DC45MmIpTog/edit?tab=t.d7cju37w6zwj','_blank')">Info</button>
      <button class="tab" onclick="window.open('https://docs.google.com/document/d/1BaIyWZoUosVcc7D3rwwEsx7-fWeDGgD4DC45MmIpTog/edit?tab=t.0','_blank')">Terminal</button>
      <button class="tab" onclick="window.open('https://docs.google.com/document/d/1BaIyWZoUosVcc7D3rwwEsx7-fWeDGgD4DC45MmIpTog/edit?tab=t.biyfduhv1w7','_blank')">Events</button>
      <button class="tab" onclick="showTab('settings')">Settings</button>
      <span id="adminIndicator">⚒︎ Administrator</span>
    </div>
    <div id="ticker">
      <div id="tickerText"></div>
    </div>
    <div id="sidebar"></div>
    <div id="main">
      <div id="searchWrap">
        <input id="search" placeholder="Search games...">
      </div>
    </div>
    <div id="tocModal">
      <div class="modal" id="tocContent"></div>
    </div>
    <div id="adminLoginModal">
      <div class="adminLoginBox">
        <form id="adminLoginForm" onsubmit="submitAdminLogin(); return false;" autocomplete="on">
          <h2>Administrator Login</h2>
          <div class="password-wrap">
            <input type="password" id="adminPassword" name="password" placeholder="Administrator Password" autocomplete="current-password">
            <button type="button" id="showPasswordBtn" onclick="toggleAdminPassword()" aria-label="Show password"> Show </button>
          </div>
          <div id="adminLoginStatus"></div>
          <button type="submit">Login</button>
          <button type="button" class="adminCancel" onclick="closeAdminLogin()">Cancel</button>
        </form>
      </div>
    </div>
    <div id="presetModal">
      <div class="presetBox">
        <h3>Tab Settings</h3>
        <input id="tabName" placeholder="Tab Name">

        text.style.whiteSpace = "nowrap";
        text.style.textOverflow = "ellipsis";
        text.title = f;
        const star = document.createElement('span');
        if (!isDV) {
          star.className = 'star ' + (favorites.includes(f) ? 'on' : 'off');
          star.style.flexShrink = "0";
          star.style.marginLeft = "12px";
          star.onclick = (e) => {
            e.stopPropagation();
            const fav = favorites.includes(f);
            if (fav) {
              favorites = favorites.filter(x => x !== f);
              star.classList.replace("on", "off");
              btn.classList.remove("fav");
            } else {
              favorites.push(f);
              star.classList.replace("off", "on");
              btn.classList.add("fav");
            }
            localStorage.setItem("favorites", JSON.stringify(favorites));
          };
        }
        btn.onclick = () => {
          const encoded = encodeURIComponent(f + '.html');
          const url = isNG ? `https://cdn.jsdelivr.net/gh/PizzaGamingYT/nol/specialgames/${encoded}?t=${Date.now()}` : isDV ? `https://cdn.jsdelivr.net/gh/PizzaGamingYT/nol/devuses/${encoded}?t=${Date.now()}` : `https://cdn.jsdelivr.net/gh/bubbls/ugs-singlefile/UGS-Files/${encoded}?t=${Date.now()}`;
          fetch(url).then(r => {
            if (!r.ok) throw new Error(`HTTP ${r.status}`);
            return r.text();
          }).then(t => {
            const w = window.open('about:blank', '_blank');
            if (!w) {
              alertNotice("warning", "Game could not open. Please allow popups for this website.");
              return;
            }
            w.document.open();
            w.document.write(t);
            w.document.close();
          }).catch(err => {
            console.error(err);
            if (!navigator.onLine) {
              alertNotice("warning", "Game could not be loaded. Please check your internet connection.");
            } else {
              alertNotice("alert", "Game could not be loaded. Please try again.");
            }
          });
        };
        btn.append(text, star);
        return btn;
      }
      document.getElementById('adminPassword').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          submitAdminLogin();
        }
      });
      let uploadedFavicon = '';

      function openPreset() {
        const p = JSON.parse(localStorage.getItem('preset') || '{}');
        tabName.value = p.name || '';
        panicKey.value = p.key || '';
        panicLink.value = p.link || '';
        uploadedFavicon = p.icon || '';
        presetModal.style.display = 'block';
      }

      function handleFaviconUpload(file) {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
          uploadedFavicon = e.target.result;
        };
        reader.readAsDataURL(file);
      }

      function savePreset() {
        const rawLink = panicLink.value.trim();
        const fixedLink = rawLink ? (rawLink.startsWith('http://') || rawLink.startsWith('https://')) ? rawLink : 'https://' + rawLink : '';
        const data = {
          name: tabName.value,
          icon: uploadedFavicon,
          key: panicKey.value,
          link: fixedLink
        };
        localStorage.setItem('preset', JSON.stringify(data));
        applyPreset();
        presetModal.style.display = 'none';
        location.reload();
      }

      function applyPreset() {
        const p = JSON.parse(localStorage.getItem('preset') || '{}');
        const panicKeyValue = p.key || '\\';
        const panicLinkValue = p.link || 'https://google.com';
        document.title = p.name || "Nol'sGames";
        let favicon = document.getElementById('dynamicFavicon');
        if (!favicon) {
          favicon = document.createElement('link');
          favicon.rel = 'icon';
          favicon.id = 'dynamicFavicon';
          document.head.appendChild(favicon);
        }
        favicon.href = p.icon || 'https://cdn.jsdelivr.net/gh/PizzaGamingYT/nol/favicon.ico?v=2';
        document.onkeydown = null;
        document.onkeydown = (e) => {
          if (typeof e.key === "string" && e.key.toLowerCase() === panicKeyValue.toLowerCase()) {
            window.location.href = panicLinkValue;
          }
        };
      }

      function resetPresets() {
        alertConfirm("Reset all preset settings?", () => {
          localStorage.removeItem('preset');
          const defaultPreset = {
            name: "Nol'sGames",
            icon: "",
            key: "\\",
            link: "https://google.com"
          };
          localStorage.setItem('preset', JSON.stringify(defaultPreset));
          uploadedFavicon = '';
          tabName.value = '';
          panicKey.value = '\\';
          panicLink.value = 'https://google.com';
          applyPreset();
          location.reload();
        });
        localStorage.setItem('preset', JSON.stringify(defaultPreset));
        uploadedFavicon = '';
        document.getElementById('faviconPreview').style.display = 'none';
        tabName.value = '';
        panicKey.value = '\\';
        panicLink.value = 'https://google.com';
        applyPreset();
        location.reload();
      }

      function closePresets() {
        document.getElementById('presetModal').style.display = 'none';
      }
      if (!localStorage.getItem('preset')) {
        localStorage.setItem('preset', JSON.stringify({
          name: "Nol'sGames",
          icon: "",
          key: "\\",
          link: "https://google.com"
        }));
      }
      applyPreset();
      if (!runningFromFile) {
        const downloadBtn = document.createElement("button");
        downloadBtn.className = "tab";
        downloadBtn.textContent = "Downloads";
        downloadBtn.onclick = () => showTab("downloads");
        document.getElementById("topbar").appendChild(downloadBtn);
      }

      function showTab(tab) {
        const main = document.getElementById('main');
        const sidebar = document.getElementById('sidebar');
        if (tab === 'games') {
          document.body.classList.add('withSidebar');
          build();
          return;
        }
        document.body.classList.remove('withSidebar');
        sidebar.innerHTML = '';
        if (tab === "downloads") {
          main.innerHTML = `
        
																																							<div class="download-page">
																																								<div class="download-card">
																																									<img src="https://cdn.jsdelivr.net/gh/PizzaGamingYT/nol/logo.png" 
                     class="download-logo" 
                     alt="Nol'sGames Logo">
																																										<h2>Download Nol'sGames</h2>
																																										<p>
                    Play your favorite games anytime.
                    Download Nol'sGames for easy access.
                </p>
																																										<div class="download-info">
																																											<div>
																																												<strong>✓ Bypasses Enterprise Firewalls</strong>
																																												<span>The file grabs code right from the source so you can play games without getting blocked!</span>
																																											</div>
																																											<div>
																																												<strong>✓ Latest Version</strong>
																																												<span>Automatic updates just by reloading! No need for extra downloads.</span>
																																											</div>
																																											<div>
																																												<strong>✓ Safe Download</strong>
																																												<span>Official Nol'sGames release in HTML format.</span>
																																											</div>
																																										</div>
																																										<button class="download-button"
    onclick="
        const downloadWindow = window.open(
            'https://drive.usercontent.google.com/u/0/uc?id=1IVVFFKsc6oOxVJre4ZL3UUvjjfbvdGzW&export=download',
            '_blank'
        );

        if (downloadWindow) {
            const handleReturn = () => {
                alertNotice('success', &quot;Nol'sGames downloaded.&quot;);
                window.removeEventListener('focus', handleReturn);
            };

            window.addEventListener('focus', handleReturn, { once: true });
        }
    ">
    ↓︎ Download Latest Version
</button>
																																										<div class="download-info">
																																											<div>
                        By downloading, you agree to the 
																																												<a class="toc-link"; href="#"; onclick="openToc()"; return false;>Terms & Conditions & Privacy Policy</a>
																																											</div>
																																										</div>
																																									</div>
																																								</div>
    `;
          return;
        }
        if (tab === 'settings') {
          main.innerHTML = `
        
																																								<div class="settings-page">
																																									<h2>Settings</h2>
																																									<div class="settings-section">
																																										<h3>Appearance</h3>
																																										<button class="standard" onclick="openPreset()">
                    Tab Settings
                </button>
																																										<label class="ngToggleWrap">
																																											<span>Show Ticker</span>
																																											<div class="ngSwitch">
																																												<input
            type="checkbox"
            id="tickerToggle"
            onchange="toggleTicker(this.checked)"
        >
																																													<span class="ngSlider"></span>
																																												</div>
																																											</label>
																																										</div>
																																										<div class="settings-section">
																																											<h3>Legal</h3>
																																											<button class="standard" onclick="openToc()">
                    Terms & Conditions & Privacy Policy
                </button>
																																										</div>
																																										<div class="settings-section">
																																											<h3>Game Data</h3>
																																											<button class="standard" onclick="exportNGS()">
                    Download Game Data (.ngs)
                </button>
																																											<button class="standard"
                    onclick="document.getElementById('ngsUpload').click()">
                    Upload Game Data (.ngs)
                </button>
																																											<input
                    type="file"
                    id="ngsUpload"
                    accept=".ngs"
                    style="display:none"
                    onchange="importNGS(this.files[0])"
                >
																																												<label class="ngToggleWrap">
																																													<span>Auto Refresh Daily</span>
																																													<div class="ngSwitch">
																																														<input
                            type="checkbox"
                            id="autoRefreshToggle"
                            onchange="toggleAutoRefresh(this.checked)"
                        >
																																															<span class="ngSlider"></span>
																																														</div>
																																													</label>
																																													<button class="danger" onclick="clearData()">
                    Clear Game Data
                </button>
																																												</div>
																																												<div class="settings-section">
																																													<h3>Administrator</h3>
																																													<button class="standard"
                    onclick="isAdmin ? adminLogout() : adminLogin()">
                    ${isAdmin ? 'Administrator Signout' : 'Administrator Login'}
                </button>
																																												</div>
																																											</div>
    `;
        }
        setTimeout(() => {
          const settings = JSON.parse(localStorage.getItem('ngSettings') || '{}');
          const autoRefreshToggle = document.getElementById('autoRefreshToggle');
          const tickerToggle = document.getElementById('tickerToggle');
          if (autoRefreshToggle) {
            autoRefreshToggle.classList.add('no-transition');
            autoRefreshToggle.checked = settings.autoRefresh !== false;
            requestAnimationFrame(() => {
              requestAnimationFrame(() => {
                autoRefreshToggle.classList.remove('no-transition');
              });
            });
          }
          if (tickerToggle) {
            tickerToggle.classList.add('no-transition');
            tickerToggle.checked = settings.ticker !== false;
            requestAnimationFrame(() => {
              requestAnimationFrame(() => {
                tickerToggle.classList.remove('no-transition');
              });
            });
          }
        }, 0);
      }

      function toggleAutoRefresh(enabled) {
        const settings = JSON.parse(localStorage.getItem('ngSettings') || '{}');
        settings.autoRefresh = enabled;
        localStorage.setItem('ngSettings', JSON.stringify(settings));
      }

      function toggleTicker(enabled) {
        const settings = JSON.parse(localStorage.getItem('ngSettings') || '{}');
        settings.ticker = enabled;
        localStorage.setItem('ngSettings', JSON.stringify(settings));
        applyTickerSetting();
      }

      function clearData() {
        alertConfirm("Delete ALL data?", () => {
          localStorage.clear();
          location.reload();
        });
      }

      function exportNGS() {
        const saveData = {};
        for (let i = 0; i < localStorage.length; i++) {
          const key = localStorage.key(i);
          try {
            saveData[key] = localStorage.getItem(key);
          } catch (err) {
            alertNotice("warning", "Download failure.");
          }
        }
        const finalData = {
          created: new Date().toISOString(),
          storage: saveData
        };
        const blob = new Blob(
          [JSON.stringify(finalData, null, 2)], {
            type: 'application/json'
          });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        const now = new Date();
        const date = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0') + '_' + String(now.getHours()).padStart(2, '0') + '-' + String(now.getMinutes()).padStart(2, '0');
        a.download = `gd_${date}.ngs`;
        a.click();
        URL.revokeObjectURL(url);
        alertNotice("success", "Game data downloaded.");
      }

      function importNGS(file) {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
          try {
            const data = JSON.parse(e.target.result);
            if (!data.storage) {
              alertNotice("warning", "Invalid or malformed .ngs file.");
              return;
            }
            alertConfirm("Overwrite ALL current game data?", () => {
              localStorage.clear();
              for (const key in data.storage) {
                try {
                  localStorage.setItem(key, data.storage[key]);
                } catch (err) {
                  console.log("Failed restoring:", key);
                  alertNotice("warning", "Failed restoration.");
                }
              }
              alertNotice("success", "Game data restored.");
              setTimeout(() => {
                location.reload();
              }, 3000);
            });
          } catch (err) {
            console.error(err);
            alertNotice("warning", "Invalid or malformed .ngs file.");
          }
        };
        reader.readAsText(file);
      }

      function checkDailyRefresh() {
        const settings = JSON.parse(localStorage.getItem('ngSettings') || '{}');
        const autoRefresh = settings.autoRefresh !== false;
        if (!autoRefresh) return;
        const today = new Date().toDateString();
        const lastRefresh = localStorage.getItem('lastDailyRefresh');
        if (lastRefresh !== today) {
          localStorage.setItem('lastDailyRefresh', today);
          location.reload();
        }
      }
      if (!localStorage.getItem('ngSettings')) {
        localStorage.setItem('ngSettings', JSON.stringify({
          autoRefresh: true,
          ticker: true
        }));
      }
      applyTickerSetting();

      function adminLogout() {
        alertConfirm("Are you sure you want to sign out of Administrator mode?", () => {
          adminToken = null;
          isAdmin = false;
          updateAdminIndicator();
          updateEruda();
          alertNotice("success", "Administrator signed out.");
          showTab('games');
        });
      }
      window.addEventListener("error", (event) => {
        console.error(event.error || event.message);
        alertNotice("alert", "Something went wrong. Check the console for details.");
      });
      window.addEventListener("unhandledrejection", (event) => {
        console.error(event.reason);
        alertNotice("alert", "Something went wrong. Check the console for details.");
      });
      checkDailyRefresh();
      loadGameList();
      console.log("%cDon't mess around in here unless you know what you're doing. If you think you do, you probably don't!", "font-weight: bold; font-size: 16px;");
    </script>
  </body>
